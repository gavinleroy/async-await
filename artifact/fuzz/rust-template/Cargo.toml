# Template manifest for fuzz-generated Rust programs. It pins the same
# dependency versions as fuzz/run.rkt and exists so that Cargo.lock can be
# generated/refreshed (`cargo generate-lockfile`) and vendored by flake.nix.
[package]
name = "generated"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "=1.50.0", features = ["full"] }
smol = "=2.0.2"
